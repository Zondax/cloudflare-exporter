# Zondax fork: build and publish the exporter image from the `zondax` branch.
#
# `master` mirrors lablabs/cloudflare-exporter; `zondax` is master plus patches
# still open upstream (drop each once merged there):
#   - lablabs/cloudflare-exporter#218 (stale series cleanup; fixes the ASN memory leak, #217)
# To update: sync master from upstream, then rebase `zondax` onto it.
# Images go to ghcr.io/zondax/cloudflare-exporter, tagged with the full commit
# SHA (pin this one) and a `git describe` version (e.g. 0.2.3-14-g1a2b3c4).
name: Zondax image

on:
  push:
    branches: [zondax]
  pull_request:
    branches: [zondax]
  workflow_dispatch:

concurrency:
  group: zondax-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      KO_DOCKER_REPO: ghcr.io/zondax/cloudflare-exporter
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git fetch --no-tags https://github.com/lablabs/cloudflare-exporter.git master
          upstream_sha=$(git merge-base HEAD FETCH_HEAD)
          describe=$(git describe --tags --match 'cloudflare-exporter-*' HEAD)
          version="${describe#cloudflare-exporter-}"
          {
            echo "sha=${GITHUB_SHA}"
            echo "version=${version}"
            echo "upstream_sha=${upstream_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} upstream=${upstream_sha}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        with:
          version: v0.18.0

      - name: Build and push
        id: publish
        env:
          SHA: ${{ steps.version.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_SHA: ${{ steps.version.outputs.upstream_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin
          ko build . --sbom=none --bare --image-refs ./image-refs \
            --platform linux/amd64,linux/arm64 \
            -t "${SHA}" -t "${VERSION}" \
            --image-label org.opencontainers.image.title=cloudflare-exporter \
            --image-label org.opencontainers.image.description="Prometheus Cloudflare exporter (Zondax fork)" \
            --image-label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --image-label org.opencontainers.image.revision="${SHA}" \
            --image-label org.opencontainers.image.version="${VERSION}" \
            --image-label org.opencontainers.image.licenses=Apache-2.0 \
            --image-label io.zondax.upstream.revision="${UPSTREAM_SHA}" \
            --image-label org.opencontainers.image.created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat ./image-refs
          digest=$(head -n 1 ./image-refs | cut -d'@' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo "- \`${KO_DOCKER_REPO}:${SHA}\`"
            echo "- \`${KO_DOCKER_REPO}:${VERSION}\`"
            echo "- digest \`${digest}\`, upstream base \`${UPSTREAM_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/zondax/cloudflare-exporter
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
